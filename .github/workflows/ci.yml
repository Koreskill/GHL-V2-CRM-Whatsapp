name: CI

# Lo mínimo que tiene que pasar antes de desplegar: tipos, lint, pruebas SIN base y build.
# Las pruebas con base (test:db, test:e2e) NO corren acá: necesitan una base de staging propia
# (nunca la de producción). Se agregan cuando exista STAGING_DATABASE_URL como secreto.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
